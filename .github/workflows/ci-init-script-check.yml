name: CI-init-script-check

on:
  push:
    branches:
    - 'main'
    paths-ignore:
    - 'sources/dist/**'
  pull_request:
    paths:
      - '.github/workflows/ci-init-script-check.yml'
      - 'sources/src/resources/init-scripts/**'
      - 'sources/test/init-scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-init-scripts:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
      with:
        egress-policy: audit

    - name: Checkout sources
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Java
      uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
      with:
        distribution: temurin
        java-version: 17
    - name: Setup Gradle
      # Use a released version to avoid breakages
      uses: ./setup-gradle
      env:
        ALLOWED_GRADLE_WRAPPER_CHECKSUMS: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 # Invalid wrapper jar used for testing
    - name: Run integration tests
      working-directory: sources/test/init-scripts
      run: ./gradlew check
